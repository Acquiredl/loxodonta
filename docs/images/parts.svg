<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Your agent makes a tool call and the recorder, loxodonta.py, writes one line for it into the record. Three things read the record: verify, a command of the recorder, which names the first line that changed; the supervisor, supervisor.py, which checks every session on the machine; and the receiver, receiver.py, which keeps a copy on another machine.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #111827; font-weight: bold; }
    .small { font-size: 12px; fill: #4b5563; font-weight: normal; }
    .file { font-size: 12px; fill: #0f766e; font-weight: normal; }
    .box { fill: none; stroke: #0f766e; stroke-width: 2; }
    .line { stroke: #0f766e; stroke-width: 2; fill: none; }
    .arrow { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#head); }
    #head path { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .small { fill: #9ca3af; }
      .file { fill: #5eead4; }
      .box, .arrow, .line { stroke: #5eead4; }
      #head path { fill: #5eead4; }
    }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- top row: who writes -->
  <rect class="box" x="20" y="20" width="190" height="92" rx="6"/>
  <text x="115" y="48" text-anchor="middle">your agent</text>
  <text class="small" x="115" y="70" text-anchor="middle">Claude Code, Codex</text>
  <text class="small" x="265" y="54" text-anchor="middle">a tool call</text>
  <path class="arrow" d="M214,66 L316,66"/>
  <rect class="box" x="320" y="20" width="290" height="92" rx="6"/>
  <text x="465" y="48" text-anchor="middle">the recorder</text>
  <text class="file" x="465" y="70" text-anchor="middle">loxodonta.py</text>
  <text class="small" x="465" y="88" text-anchor="middle">writes one line per tool call</text>
  <path class="arrow" d="M614,66 L686,66"/>
  <rect class="box" x="690" y="20" width="290" height="92" rx="6"/>
  <text x="835" y="48" text-anchor="middle">the record</text>
  <text class="small" x="835" y="70" text-anchor="middle">one line per call, each holding</text>
  <text class="small" x="835" y="88" text-anchor="middle">a fingerprint of the line before</text>

  <!-- the record feeds the three readers below -->
  <path class="line" d="M835,112 L835,150 L165,150"/>
  <text class="small" x="500" y="140" text-anchor="middle">read by</text>
  <path class="arrow" d="M165,150 L165,186"/>
  <path class="arrow" d="M500,150 L500,186"/>
  <path class="arrow" d="M835,150 L835,186"/>

  <!-- bottom row: who checks -->
  <rect class="box" x="20" y="190" width="290" height="108" rx="6"/>
  <text x="165" y="218" text-anchor="middle">verify</text>
  <text class="file" x="165" y="240" text-anchor="middle">a command of the recorder</text>
  <text class="small" x="165" y="258" text-anchor="middle">rereads every line and names</text>
  <text class="small" x="165" y="276" text-anchor="middle">the first one that changed</text>
  <rect class="box" x="355" y="190" width="290" height="108" rx="6"/>
  <text x="500" y="218" text-anchor="middle">the supervisor</text>
  <text class="file" x="500" y="240" text-anchor="middle">supervisor.py</text>
  <text class="small" x="500" y="258" text-anchor="middle">checks every session on the</text>
  <text class="small" x="500" y="276" text-anchor="middle">machine and shows them on one page</text>
  <rect class="box" x="690" y="190" width="290" height="108" rx="6"/>
  <text x="835" y="218" text-anchor="middle">the receiver</text>
  <text class="file" x="835" y="240" text-anchor="middle">receiver.py, on another machine</text>
  <text class="small" x="835" y="258" text-anchor="middle">keeps a copy the agent</text>
  <text class="small" x="835" y="276" text-anchor="middle">cannot reach</text>

  <text class="small" x="500" y="326" text-anchor="middle">The recorder writes. The other three are how a change to what it wrote gets caught.</text>
</svg>
