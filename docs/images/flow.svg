<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="The agent makes a tool call; the harness runs the hook after the call; the hook writes one receipt onto the chain; verify and the supervisor read the chain back.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #111827; }
    .small { font-size: 12px; fill: #4b5563; }
    .box { fill: none; stroke: #0f766e; stroke-width: 2; }
    .arrow { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#head); }
    #head path { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .small { fill: #9ca3af; }
      .box, .arrow { stroke: #5eead4; }
      #head path { fill: #5eead4; }
    }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Each arrow label sits inside its gap, above the arrow, on two short
       lines: a label wider than its gap runs over the boxes' borders. -->

  <rect class="box" x="20" y="50" width="110" height="80" rx="6"/>
  <text x="75" y="95" text-anchor="middle">the agent</text>

  <text class="small" x="168" y="80" text-anchor="middle">a tool</text>
  <text class="small" x="168" y="94" text-anchor="middle">call</text>
  <path class="arrow" d="M134,110 L203,110"/>

  <rect class="box" x="207" y="50" width="170" height="80" rx="6"/>
  <text x="292" y="85" text-anchor="middle">the harness</text>
  <text class="small" x="292" y="106" text-anchor="middle">Claude Code, Codex CLI</text>

  <text class="small" x="415" y="80" text-anchor="middle">after</text>
  <text class="small" x="415" y="94" text-anchor="middle">the call</text>
  <path class="arrow" d="M381,110 L450,110"/>

  <rect class="box" x="454" y="50" width="110" height="80" rx="6"/>
  <text x="509" y="95" text-anchor="middle">the hook</text>

  <text class="small" x="602" y="80" text-anchor="middle">one</text>
  <text class="small" x="602" y="94" text-anchor="middle">receipt</text>
  <path class="arrow" d="M568,110 L637,110"/>

  <rect class="box" x="641" y="50" width="150" height="80" rx="6"/>
  <text x="716" y="85" text-anchor="middle">the chain</text>
  <text class="small" x="716" y="106" text-anchor="middle">each links the last</text>

  <text class="small" x="829" y="80" text-anchor="middle">read</text>
  <text class="small" x="829" y="94" text-anchor="middle">back</text>
  <path class="arrow" d="M795,110 L864,110"/>

  <rect class="box" x="868" y="50" width="112" height="80" rx="6"/>
  <text x="924" y="85" text-anchor="middle">verify</text>
  <text class="small" x="924" y="106" text-anchor="middle">supervisor</text>

  <text class="small" x="500" y="165" text-anchor="middle">The agent is what is recorded, not what decides whether a receipt is written.</text>
</svg>
