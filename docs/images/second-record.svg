<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="At the receiver, the receipts that arrived for the staged session are counted against the harness's own events, tool by tool. Say receipt 5 was cut off the end before it was sent: WebSearch, WebFetch and Read match, Bash has one receipt for two calls, and the session reads ENDED-DEFICIT.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #111827; white-space: pre; }
    .title { font-size: 14px; }
    .key, .cap { fill: #4b5563; }
    .link { fill: #0f766e; font-weight: bold; }
    .bad { fill: #b91c1c; font-weight: bold; }
    .box { fill: none; stroke: #0f766e; stroke-width: 2; }
    .rule { stroke: #9ca3af; stroke-width: 1; }
    .arrow { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#head); }
    #head path { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .key, .cap { fill: #9ca3af; }
      .link { fill: #5eead4; }
      .bad { fill: #fca5a5; }
      .box, .arrow { stroke: #5eead4; }
      .rule { stroke: #6b7280; }
      #head path { fill: #5eead4; }
    }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- the count, tool by tool -->
  <rect class="box" x="20" y="20" width="600" height="218" rx="6"/>
  <text class="title" x="36" y="48">at the receiver, the staged session, tool by tool</text>
  <text x="36" y="80"><tspan class="key">tool         receipts arrived   the harness's events</tspan></text>
  <line class="rule" x1="36" y1="90" x2="604" y2="90"/>
  <text x="36" y="114">WebSearch    1                  1</text>
  <text x="36" y="138">WebFetch     1                  1</text>
  <text x="36" y="162">Read         1                  1</text>
  <text x="36" y="186">Bash         <tspan class="bad">1</tspan>                  <tspan class="bad">2</tspan></text>
  <text x="36" y="220"><tspan class="key">say receipt 5, the sed that removed the hook, was cut off the end</tspan></text>

  <path class="arrow" d="M624,130 L716,130"/>

  <rect class="box" x="720" y="80" width="260" height="100" rx="6"/>
  <text x="736" y="112"><tspan class="bad">ENDED-DEFICIT</tspan></text>
  <text x="736" y="138"><tspan class="key">Bash: one receipt</tspan></text>
  <text x="736" y="160"><tspan class="key">for two calls</tspan></text>

  <text class="cap" x="500" y="282" text-anchor="middle">Cut from the end, the chain still reads VALID, and the head sent at session end is the cut chain's own.</text>
  <text class="cap" x="500" y="304" text-anchor="middle">Only a second record, kept by the harness and not the hook, shows the call that has no receipt.</text>
</svg>
