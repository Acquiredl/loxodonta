# The suite, on the three platforms and the oldest and newest Python the
# README promises (3.9+). Stdlib only: there is nothing to install, so a
# green run here is the claim "the recorder holds on a machine that is
# not the author's" made by someone other than the author.
name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older run, which
# nobody will read. Runs on main and dev are never cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two tiers (#418). A pull request into dev is the fast tier: the suite
  # on ubuntu-latest / py3.9 alone, in six shards. Everything else (a push
  # to dev or main, a pull request into main, a manual run) is the full
  # tier: five targets in three shards each. A break that shows only on
  # another target lands on dev and is caught by the push run its merge
  # starts; a promotion to main still waits on all five. The test
  #   github.event_name == 'pull_request' && github.base_ref == 'dev'
  # is written out seven times (the target list, the shard list, SHARDS
  # and four roll-ups below), since neither a matrix nor a job's `if` can
  # read `env`; the seven must agree.
  #
  # Each shard runs on its own machine: one serial run took 20 to 34
  # minutes, nearly all of it Python starting the CLI. Separate machines,
  # never parallel processes on one: the suite's timing tests miss their
  # windows on a loaded machine.
  suite:
    name: ${{ matrix.target.os }} / py${{ matrix.target.python }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'dev'
          && '[{"os": "ubuntu-latest", "python": "3.9"}]'
          || '[{"os": "ubuntu-latest", "python": "3.9"},
          {"os": "ubuntu-latest", "python": "3.11"},
          {"os": "ubuntu-latest", "python": "3.13"},
          {"os": "windows-latest", "python": "3.13"},
          {"os": "macos-latest", "python": "3.13"}]') }}
        shard: >-
          ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'dev'
          && '[1, 2, 3, 4, 5, 6]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: a test runs the released
          # verifier.py from its tag's bytes (ADR-0038's compatibility).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.target.python }}
      - name: unit tests through the public CLI
        env:
          PYTHONIOENCODING: utf-8
          SHARD: ${{ matrix.shard }}
          # the length of the shard list above; the two must agree
          SHARDS: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && 6 || 3 }}
        shell: python
        run: |
          import os, subprocess, sys, unittest
          from pathlib import Path

          # This script runs from a temporary file, so the checkout is not
          # on the import path until it is put there.
          sys.path.insert(0, os.getcwd())
          shard, shards = int(os.environ["SHARD"]), int(os.environ["SHARDS"])
          assert 1 <= shard <= shards, (shard, shards)
          # Heaviest module first, each to the lightest shard so far, so the
          # shards finish together; a module's test count stands in for its
          # time. Every machine computes the same split from the same tree.
          names = sorted(p.stem for p in Path("tests").glob("test_*.py"))
          weight = {n: unittest.defaultTestLoader.loadTestsFromName(
              "tests." + n).countTestCases() for n in names}
          shelves, totals = [[] for _ in range(shards)], [0] * shards
          for n in sorted(names, key=lambda n: (-weight[n], n)):
              lightest = totals.index(min(totals))
              shelves[lightest].append(n)
              totals[lightest] += weight[n]
          mine = sorted(shelves[shard - 1])
          print(f"shard {shard} of {shards}, {totals[shard - 1]} tests:",
                ", ".join(mine), flush=True)
          sys.exit(subprocess.call([sys.executable, "-m", "unittest", "-v",
                                    *("tests." + n for n in mine)]))

  # The names branch protection requires, one per platform: each passes only
  # when every shard that ran passed. The shard jobs above say which one
  # failed. These names, the target list above and the protection's
  # required checks are one list kept three times. `always()`, never
  # `!cancelled()`: a required check that is skipped counts as passed, so a
  # cancelled run would leave these green with the suite unrun.
  #
  # One job per name, never a matrix: a matrix job its `if` skips reports
  # under its unexpanded name, so a required per-target name would never
  # report and the pull request would wait forever (#418). On a pull
  # request into dev the four targets the fast tier does not run are
  # skipped, which the protection on dev counts as passed.
  py39:
    name: ubuntu-latest / py3.9
    needs: suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.suite.result }}" = success

  py311:
    name: ubuntu-latest / py3.11
    needs: suite
    if: ${{ always() && !(github.event_name == 'pull_request' && github.base_ref == 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.suite.result }}" = success

  py313:
    name: ubuntu-latest / py3.13
    needs: suite
    if: ${{ always() && !(github.event_name == 'pull_request' && github.base_ref == 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.suite.result }}" = success

  windows:
    name: windows-latest / py3.13
    needs: suite
    if: ${{ always() && !(github.event_name == 'pull_request' && github.base_ref == 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.suite.result }}" = success

  macos:
    name: macos-latest / py3.13
    needs: suite
    if: ${{ always() && !(github.event_name == 'pull_request' && github.base_ref == 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.suite.result }}" = success

  # The house checker: the repo's own vocabulary (GLOSSARY anti-terms, the
  # front door's no-em-dash and no-overclaim rules, the tool's old name
  # where it can only mean the tool, and the synonym table, over the
  # Markdown and, for the anti-terms and synonyms, the tool files too)
  # enforced by the same stdlib script a contributor runs locally. Then
  # the front door (issue #298): the shape a stranger meets, the README's
  # first screen, the pictures, the indexes, the root, the changelog and
  # the ADR names. One platform is enough; the rules are about words and
  # files, not operating systems.
  house:
    name: house checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the repo's vocabulary, enforced
        run: python tools/house_check.py
      - name: the front door
        run: python tools/house_check.py --front-door
      - name: verifier.py is the copy of this recorder (ADR-0035)
        run: python tools/build_verifier.py --check
